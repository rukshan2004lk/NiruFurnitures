<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NiRu Furnitures - Admin Settings</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>

  <div class="admin-mobile-topbar">
    <div class="fw-bold fs-5 text-white">NiRu Admin</div>
    <button class="btn btn-outline-light btn-sm" type="button" data-bs-toggle="offcanvas" data-bs-target="#adminMobileSidebar" aria-controls="adminMobileSidebar">
      <i class="bi bi-list fs-5"></i> Menu
    </button>
  </div>

  <div class="offcanvas offcanvas-start bg-dark text-light" tabindex="-1" id="adminMobileSidebar" aria-labelledby="adminMobileSidebarLabel">
    <div class="offcanvas-header border-bottom border-secondary">
      <h5 class="offcanvas-title text-white fw-bold" id="adminMobileSidebarLabel">Admin Navigation</h5>
      <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas" aria-label="Close"></button>
    </div>
    <div class="offcanvas-body p-3">
      <ul class="nav flex-column gap-2 mb-4">
        <li class="nav-item"><a href="admin-dashboard.html" class="nav-link text-white-50"><i class="bi bi-speedometer2 me-2"></i>Dashboard</a></li>
        <li class="nav-item"><a href="admin-products.html" class="nav-link text-white-50"><i class="bi bi-box-seam me-2"></i>Products</a></li>
        <li class="nav-item"><a href="admin-orders.html" class="nav-link text-white-50"><i class="bi bi-cart me-2"></i>Orders</a></li>
        <li class="nav-item"><a href="admin-customers.html" class="nav-link text-white-50"><i class="bi bi-people me-2"></i>Customers</a></li>
        <li class="nav-item"><a href="admin-settings.html" class="nav-link active fw-bold text-white"><i class="bi bi-gear me-2"></i>Settings</a></li>
        <li class="nav-item"><hr class="dropdown-divider border-secondary"></li>
        <li class="nav-item"><a href="../index.html" class="nav-link text-warning"><i class="bi bi-box-arrow-left me-2"></i>Exit to Storefront</a></li>
      </ul>
    </div>
  </div>

  <aside class="admin-sidebar">
   <div class="admin-brand">
      <h2>Admin Panel</h2>
      <small>Manage NiRu Furnitures</small>
    </div>

    <ul class="admin-menu">
      <li>
        <a href="admin-dashboard.html" class="admin-link">
          <i class="bi bi-grid"></i> Dashboard
        </a>
      </li>
      <li>
        <a href="admin-products.html" class="admin-link">
          <i class="bi bi-box-seam"></i> Products
        </a>
      </li>
      <li>
        <a href="admin-orders.html" class="admin-link">
          <i class="bi bi-cart"></i> Orders
        </a>
      </li>
      <li>
        <a href="admin-customers.html" class="admin-link">
          <i class="bi bi-people"></i> Customers
        </a>
      </li>
      <li>
        <a href="admin-settings.html" class="admin-link active">
          <i class="bi bi-gear"></i> Settings
        </a>
      </li>
    
    </ul>

     <div class="px-3 mt-auto">
      <a href="../index.html" class="admin-link">
       <i class="bi bi-box-arrow-left"></i> Log out
      </a>
    </div>
  </aside>

  <main class="admin-main">
    
    <div class="top-header-glass">
      <div>
        <h1 class="fs-4 fw-semibold mb-0" style="color: var(--niru-primary);">Settings</h1>
      </div>
    </div>

    <div class="admin-content-canvas">
      
      <div class="admin-stat-card mb-4 h-auto">
        <h2 class="fs-4 fw-semibold mb-4" style="color: var(--niru-primary);">Account Information</h2>
        
        <form onsubmit="event.preventDefault();">
          <div class="row g-4 mb-4">
            <div class="col-12 col-md-6">
              <label for="fullName" class="form-label-custom">Full Name</label>
              <input type="text" class="form-control form-control-custom" id="fullName" value="Alexander Nielsen">
            </div>
            <div class="col-12 col-md-6">
              <label for="phoneNumber" class="form-label-custom">Phone Number</label>
              <input type="text" class="form-control form-control-custom" id="phoneNumber" value="076 4209970">
            </div>
          </div>

          <div class="text-end">
            <button type="submit" class="btn-niru-action">Update Account</button>
          </div>
        </form>
      </div>

      <div class="admin-stat-card mb-4 h-auto">
        <div class="d-flex align-items-center gap-2 mb-4">
          <i class="bi bi-lock fs-4" style="color: var(--niru-primary);"></i>
          <h2 class="fs-4 fw-semibold mb-0" style="color: var(--niru-primary);">Change Password</h2>
        </div>

        <form onsubmit="event.preventDefault();">
          
          <div class="mb-4">
            <label for="currentPassword" class="form-label-custom">Current Password</label>
            <input type="password" class="form-control form-control-custom" id="currentPassword" value="••••••••">
          </div>

          <div class="row g-4 mb-4">
            <div class="col-12 col-md-6">
              <label for="newPassword" class="form-label-custom">New Password</label>
              <input type="password" class="form-control form-control-custom" id="newPassword" placeholder="••••••••">
            </div>
            <div class="col-12 col-md-6">
              <label for="confirmNewPassword" class="form-label-custom">Confirm New Password</label>
              <input type="password" class="form-control form-control-custom" id="confirmNewPassword" placeholder="••••••••">
            </div>
          </div>

          <div class="text-end">
            <button type="submit" class="btn-niru-action">Save Password</button>
          </div>
        </form>
      </div>

    </div>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/script.js"></script>
</body>
</html>
